<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Introduction</title>
</head>

<body>
     <p id="sorting"></p>

     <script>
          let array = [7, 12, 9, 4, 11];
          let size = array.length;
          let minvalue = array.at(0);


          for (let i = 0; i < size; i++) {

               if (array[i] < minvalue) {
                    minvalue = array[i];
               }
          }

          document.getElementById("sorting").innerHTML = `The Minimum Value of an array is a: ${minvalue}`;
     </script>
</body>

</html>
